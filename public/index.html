<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocIntel Enterprise - AI Document Intelligence System</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  
  <!-- Premium Modern Typography (Plus Jakarta Sans & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
              950: '#042f2e',
            },
            dark: {
              card: '#0f172a',
              surface: '#020617',
              border: '#1e293b',
            }
          },
          animation: {
            'gradient-x': 'gradient-x 15s ease infinite',
            'pulse-subtle': 'pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            'gradient-x': {
              '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
              '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },
            },
            'pulse-subtle': {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.6' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom sleek scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.45);
    }

    /* Ambient background gradient glow */
    .ambient-mesh-dark {
      background-color: #020617;
      background-image: 
        radial-gradient(at 10% 10%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 15%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 85%, rgba(16, 185, 129, 0.08) 0px, transparent 55%);
      background-attachment: fixed;
    }

    .ambient-mesh-light {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 10% 10%, rgba(6, 182, 212, 0.06) 0px, transparent 50%),
        radial-gradient(at 90% 15%, rgba(99, 102, 241, 0.06) 0px, transparent 50%),
        radial-gradient(at 50% 85%, rgba(16, 185, 129, 0.04) 0px, transparent 55%);
      background-attachment: fixed;
    }

    /* Subtle Glassmorphism Card Style */
    .glass-card-dark {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.6);
    }
    .glass-card-light {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
  </style>

  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="font-sans antialiased selection:bg-cyan-500 selection:text-white transition-colors duration-300">
  <div id="root"></div>
  <script src="/app.js"></script>
</body>
</html>
